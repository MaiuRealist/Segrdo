<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080d" />
  <title>Uma carta para você</title>
  <style>
    :root {
      --night: #08080d;
      --night-blue: #101323;
      --lavender: #c6b1ee;
      --lilac: #9b80ce;
      --paper: #f4eddf;
      --ink: #342b39;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: #f5efff;
      background: radial-gradient(ellipse at 50% 36%, #17172a 0%, #0c0c15 43%, var(--night) 78%);
      font-family: Georgia, 'Times New Roman', serif;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .26;
      background-image: radial-gradient(1px 1px at 12% 19%, #fff 50%, transparent 100%), radial-gradient(1px 1px at 76% 14%, #d9c8ff 50%, transparent 100%), radial-gradient(1px 1px at 88% 71%, #fff 50%, transparent 100%), radial-gradient(1px 1px at 23% 81%, #c5b0ff 50%, transparent 100%), radial-gradient(1px 1px at 56% 61%, #fff 50%, transparent 100%);
      background-size: 320px 280px;
    }
    .scene { position: relative; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 42px 18px; isolation: isolate; }
    .glow { position: absolute; width: min(78vw, 620px); aspect-ratio: 1; border-radius: 50%; background: #7c5bb0; filter: blur(110px); opacity: .11; z-index: -1; }
    .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
    .petal { position: absolute; top: -35px; width: 9px; height: 15px; border-radius: 90% 10% 80% 20%; background: linear-gradient(145deg, #d9c9f6, #8064b2); opacity: 0; animation: fall linear infinite; filter: drop-shadow(0 0 5px #b99ae944); }
    @keyframes fall { 0% { transform: translate3d(0,-5vh,0) rotate(0); opacity: 0; } 10% { opacity: .65; } 90% { opacity: .5; } 100% { transform: translate3d(var(--drift),110vh,0) rotate(560deg); opacity: 0; } }
    .intro { width: min(100%, 650px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; animation: fadeIn 1.3s ease both; }
    .eyebrow { color: var(--lavender); font: 11px/1.5 system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
    h1 { font-weight: 400; font-size: clamp(28px, 5vw, 43px); line-height: 1.2; margin: 0; text-wrap: balance; }
    .subtitle { max-width: 370px; color: #c6bfd3; font-size: 15px; line-height: 1.8; margin: 0; }
    .envelope-button { appearance: none; border: 0; background: transparent; padding: 18px; margin: 3px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .envelope-button:focus-visible { outline: 2px solid var(--lavender); outline-offset: 6px; border-radius: 10px; }
    .envelope { position: relative; width: min(67vw, 270px); aspect-ratio: 1.42; filter: drop-shadow(0 18px 32px #0008); transition: transform .4s ease, filter .4s ease; }
    .envelope-button:hover .envelope { transform: translateY(-7px) scale(1.025); filter: drop-shadow(0 23px 36px #0009); }
    .env-back { position: absolute; inset: 0; border-radius: 5px; background: linear-gradient(135deg, #d7c8e8, #9e87be); }
    .letter-peek { position: absolute; left: 9%; width: 82%; height: 82%; top: 1%; background: var(--paper); border-radius: 2px; transition: transform .9s cubic-bezier(.2,.75,.2,1); }
    .letter-peek::before { content: ""; position: absolute; top: 17%; left: 17%; right: 17%; height: 1px; background: #d6c9d9; box-shadow: 0 15px #d6c9d9, 0 30px #d6c9d9; }
    .env-front { position: absolute; inset: 0; background: #b9a5d0; clip-path: polygon(0 0,50% 58%,100% 0,100% 100%,0 100%); border-radius: 4px; }
    .env-flap { position: absolute; inset: 0; background: linear-gradient(145deg, #e3d8ed, #b5a0d0); clip-path: polygon(0 0,100% 0,50% 62%); transform-origin: top; transition: transform .75s ease; z-index: 3; }
    .seal { position: absolute; z-index: 4; width: 43px; height: 43px; left: 50%; top: 57%; transform: translate(-50%,-50%); border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, #cab6ed, #76559f 70%); border: 1px solid #e2d4f3aa; color: #f4eafa; font-size: 22px; box-shadow: 0 3px 9px #47335b66; transition: opacity .3s, transform .4s; }
    .click-hint { color: #d4c7e8; font: 12px system-ui, sans-serif; letter-spacing: .08em; animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .55; } }
    .note { color: #898198; font: 11px system-ui, sans-serif; letter-spacing: .04em; }
    .letter-stage { display: none; width: 100%; max-width: 720px; perspective: 1200px; }
    .paper { position: relative; width: 100%; padding: clamp(25px, 6vw, 58px) clamp(23px, 7vw, 72px); color: var(--ink); background: repeating-linear-gradient(0deg, #f4eddf, #f4eddf 31px, #e6dbd4 32px); box-shadow: 0 24px 90px #0009; border: 1px solid #fff8; transform: translateY(25px) rotateX(3deg); opacity: 0; }
    .paper::before { content: ""; position: absolute; inset: 9px; border: 1px solid #bcaac3; opacity: .55; pointer-events: none; }
    .paper-top { position: relative; text-align: center; color: #80668e; font: 10px system-ui, sans-serif; letter-spacing: .23em; text-transform: uppercase; margin-bottom: 28px; }
    .paper h2 { position: relative; font-size: clamp(25px, 5vw, 35px); font-weight: 400; margin: 0 0 25px; }
    .letter-copy { position: relative; white-space: pre-wrap; font-size: clamp(16px, 2.4vw, 19px); line-height: 1.95; min-height: 200px; }
    .cursor { display: inline-block; width: 2px; height: 1.1em; margin-left: 2px; vertical-align: -2px; background: #80668e; animation: blink .8s steps(2,start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .signature { position: relative; margin-top: 25px; color: #6f557d; font-size: 21px; font-style: italic; opacity: 0; transition: opacity 1.3s ease; }
    .signature.show { opacity: 1; }
    .end-note { text-align: center; color: #d4c6e9; font-size: 13px; line-height: 1.8; margin: 28px 0 0; opacity: 0; transition: opacity 1.4s ease; }
    .end-note.show { opacity: 1; }
    .restart { display: block; margin: 22px auto 0; padding: 10px 16px; color: #c8b5e5; background: transparent; border: 1px solid #75618f; border-radius: 30px; font: 12px system-ui, sans-serif; cursor: pointer; opacity: 0; transition: opacity .5s; }
    .restart.show { opacity: .8; }
    .opened .intro { display: none; }
    .opened .letter-stage { display: block; animation: paperIn 1.1s .15s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes paperIn { to { opacity: 1; } }
    .opened .paper { animation: paperIn 1.1s .2s ease forwards; }
    .opened .petals { opacity: .45; }
    .opened .scene { align-items: flex-start; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    @media (max-width: 480px) { .scene { padding: 30px 14px; } .paper { padding: 31px 25px; } .letter-copy { line-height: 1.8; } .paper::before { inset: 6px; } }
  </style>
</head>
<body>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <main class="scene" id="scene">
    <div class="glow" aria-hidden="true"></div>
    <section class="intro" aria-labelledby="intro-title">
      <div class="eyebrow"></div>
      <h1 id="intro-title">Para uma pessoa especial.</h1>
      <p class="subtitle">Escrevi algo que talvez você vá gostar Nihi Nihi.<br>Esta carta é pra vc</p>
      <button class="envelope-button" id="openLetter" aria-label="Abrir a carta">
        <div class="envelope" aria-hidden="true">
          <div class="env-back"></div><div class="letter-peek"></div><div class="env-front"></div><div class="env-flap"></div><div class="seal">✿</div>
        </div>
      </button>
      <div class="click-hint">Toque na carta</div>

    </section>

    <section class="letter-stage" aria-live="polite" aria-label="Carta">
      <article class="paper">
        <div class="paper-top">Uma carta escrita à mão, em pensamento</div>
        <h2>Querida Nihi,</h2>
        <div class="letter-copy" id="letterCopy"></div><span class="cursor" id="cursor" aria-hidden="true"></span>
        <div class="signature" id="signature"><br><span id="sender">alguém que nunca quer te deixar sozinha</span></div>
      </article>
      <p class="end-note" id="endNote">Algumas cartas terminam aqui.<br></p>
      <button class="restart" id="restart">Ler novamente</button>
    </section>
  </main>
  <script>
    // Personalize este texto e a assinatura antes de enviar o site.
    const letterText = `Eu não sei muito bem como entregar flores, não sei como fazer essas coisas sem parecer idiota. Então, pensei que talvez escrever uma carta fosse uma maneira bonita de fazer isso pra você.

Não escrevi isso com o propósito de ser romântico. Só queria encontrar uma forma diferente de demonstrar que penso em você, que presto atenção nas pequenas coisas e que, de alguma maneira, você acabou se tornando alguém especial para mim.

Quando descobri que esse era o seu anime favorito, pensei: por que não? Por que não escrever algo para a garota de quem eu gosto na forma de uma carta? Talvez seja uma ideia meio boba, talvez eu esteja sendo um pouco bobo, mas acho que, às vezes, são justamente essas pequenas atitudes que tornam as coisas especiais.

Eu poderia simplesmente falar isso em call, fingir que não pensei nessa surpresa ou deixar passar a oportunidade por medo de parecer estranho. Mas, sinceramente, achei que seria muito mais legal tentar. Afinal, não é todo dia que encontramos alguém pra fazer algo diferente.

Não sei se vou conseguir expressar tudo da maneira certa, mas espero que você consiga perceber a intenção por trás dessas palavras. Não quero que essa carta seja vista como uma grande declaração ou como uma tentativa de transformar algo simples em algo complicado. Quero apenas que ela seja uma lembrança de que existe alguém que pensa em você, que quis tirar um tempinho do próprio dia para preparar algo que pudesse arrancar um sorriso seu.

E, se eu conseguir isso, mesmo que por alguns segundos, já vou considerar que valeu a pena.

Talvez eu ainda não saiba entregar flores cor de vinho, nem saiba encontrar as palavras certas. Talvez eu continue sendo um pouco bobo quando o assunto é demonstrar o que sinto. Mas acho que não tem problema. No fim das contas, prefiro ser um bobo que tenta demonstrar o que sente a alguém que deixa passar oportunidades por medo de tentar.

Então, aqui está minha pequena surpresa. Uma carta, inspirada em algo de que você gosta, feita por alguém que morre em gank no metrô, mas que teve vontade de fazer algo por você.

Espero que você goste. Fiz com carinho, e isso, por enquanto, é tudo o que eu queria que você soubesse: que eu sempre estarei aqui por você e, mesmo nos momentos de briga e desentendimento, eu quero estar com você e nunca conseguiria te deixar sozinha. Você sempre pode contar comigo e sempre terá todo o meu empenho na hora de fazer library com você grade 5. Obrigado por sempre melhorar meu dia, e essa carta é 1% disso.`;
    const senderName = 'O Maior idiota do mundo'; // Troque pelo seu nome ou apelido.

    const body = document.body;
    const openButton = document.getElementById('openLetter');
    const copy = document.getElementById('letterCopy');
    const cursor = document.getElementById('cursor');
    const signature = document.getElementById('signature');
    const sender = document.getElementById('sender');
    const endNote = document.getElementById('endNote');
    const restart = document.getElementById('restart');
    let typingTimer;

    sender.textContent = senderName;

    // Pétalas decorativas; não há música nem reprodução automática de áudio.
    const petals = document.getElementById('petals');
    for (let i = 0; i < 18; i++) {
      const petal = document.createElement('span');
      petal.className = 'petal';
      petal.style.left = `${Math.random() * 100}%`;
      petal.style.animationDuration = `${13 + Math.random() * 16}s`;
      petal.style.animationDelay = `${Math.random() * -26}s`;
      petal.style.setProperty('--drift', `${Math.round(Math.random() * 180 - 90)}px`);
      petal.style.transform = `scale(${0.55 + Math.random() * 0.9})`;
      petals.appendChild(petal);
    }

    function startTyping() {
      clearTimeout(typingTimer);
      copy.textContent = '';
      signature.classList.remove('show');
      endNote.classList.remove('show');
      restart.classList.remove('show');
      cursor.style.display = 'inline-block';
      let i = 0;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function typeNext() {
        if (i < letterText.length) {
          copy.textContent += letterText.charAt(i);
          i++;
          // Pausas pequenas em pontuação deixam a escrita mais natural.
          const char = letterText.charAt(i - 1);
          const delay = reducedMotion ? 0 : ('.!?…'.includes(char) ? 260 : ',;:'.includes(char) ? 135 : 29 + Math.random() * 26);
          typingTimer = setTimeout(typeNext, delay);
          if (i % 5 === 0) window.scrollTo({ top: document.body.scrollHeight, behavior: reducedMotion ? 'auto' : 'smooth' });
        } else {
          cursor.style.display = 'none';
          signature.classList.add('show');
          setTimeout(() => { endNote.classList.add('show'); restart.classList.add('show'); }, 700);
        }
      }
      typeNext();
    }

    openButton.addEventListener('click', () => {
      if (body.classList.contains('opened')) return;
      body.classList.add('opened');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      startTyping();
    });
    restart.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      startTyping();
    });
  </script>
</body>
</html>
